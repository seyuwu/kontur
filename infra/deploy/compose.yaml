name: kontur-demo
x-runtime: &runtime
  env_file: ../../.local/deploy/.env
  init: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: kontur
      POSTGRES_DB: kontur
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Prepare deployment environment first}
    volumes: ["database:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kontur -d kontur"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 128mb
  migrate:
    <<: *runtime
    image: kontur-worker:${APP_RELEASE:-local}
    build: { context: ../.., target: worker }
    command: ["node", "scripts/container-init.mjs", "migrate"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
  worker:
    <<: *runtime
    image: kontur-worker:${APP_RELEASE:-local}
    build: { context: ../.., target: worker }
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m,mode=1777"]
    stop_grace_period: 90s
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "scripts/check-worker.mjs"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
  web:
    <<: *runtime
    image: kontur-web:${APP_RELEASE:-local}
    build: { context: ../.., target: web }
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m,mode=1777"]
    ports: ["127.0.0.1:3080:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 4
  seed:
    <<: *runtime
    image: kontur-worker:${APP_RELEASE:-local}
    profiles: ["tools"]
    command: ["node", "scripts/container-init.mjs", "seed"]
    depends_on:
      migrate: { condition: service_completed_successfully }
  proxy:
    image: caddy:2.11.7-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set deployment SITE_ADDRESS}
    ports: ["${DEPLOY_BIND:-127.0.0.1}:80:80", "${DEPLOY_BIND:-127.0.0.1}:443:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "certificates:/data", "caddy-config:/config"]
    depends_on:
      web: { condition: service_healthy }
volumes:
  database:
  certificates:
  caddy-config:
